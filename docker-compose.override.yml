# Local dev only — NOT committed (see .gitignore).
# Docker Compose auto-merges this on top of docker-compose.yml. The committed file
# intentionally publishes no host ports (production runs behind Traefik on the internal
# network); this adds the host ports you need to reach things from your machine.
#
#   docker compose up db                                   # just the DB (run api/ui natively)
#   docker compose up --build                              # whole stack in Docker (no profiles -- see AGENTS.md)
#
# DB is on 5442 to avoid clashing with the local non-Docker Postgres on 5432.
# API is on 8090 because the sibling 'devlane' project owns 8080 on this machine.
services:
  db:
    ports:
      - "5442:5432"

  api:
    ports:
      - "8090:8080"

  redis:
    ports:
      - "6379:6379"

  ui:
    build:
      args:
        # NEXT_PUBLIC_* is baked at build time; point the browser bundle at the published API.
        NEXT_PUBLIC_API_BASE: "http://localhost:8090"
    ports:
      - "3000:3000"
