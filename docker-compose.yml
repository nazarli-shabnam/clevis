name: clevis

# No host port bindings — Traefik (Coolify proxy) routes traffic to containers
# via the internal Docker network. Exposing ports to the host would conflict
# with Traefik on 8080 and is a security risk.
#
# Local dev: docker compose up db            → DB only (run api/ui/worker locally)
#            docker compose up --build       → full stack

services:
  # mem_limit values are tuned for a 4GB host, leaving headroom for the OS and Traefik --
  # without a per-container cap, one service creeping up in RSS starves the others via the
  # kernel OOM-killer, which doesn't necessarily pick the actual offender. Revisit if the
  # host's RAM budget changes.
  db:
    container_name: db
    # Pinned by digest (the tag stays for readability); Dependabot's docker-compose ecosystem bumps both.
    image: postgres:17@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      # Consumed by docker/postgres-init/01-create-worker-role.sh on first init only --
      # unset means the worker keeps sharing DB_USER/DB_PASSWORD.
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:-}
      # Consumed by docker/postgres-init/02-create-api-role.sh on first init only --
      # unset means the API keeps connecting as the DB_USER superuser role.
      API_DB_PASSWORD: ${API_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - clevis

  # Managed queue for webhook ingestion (Redis Streams).
  # --appendonly yes: stream entries must survive a container restart -- a lost entry
  # here is a lost/delayed webhook event, not just a cache miss.
  # --requirepass: leaving Redis open would let any other compromised container on the
  # shared `clevis` network read, delete, or inject stream entries. REDIS_PASSWORD is
  # required, mirroring DB_PASSWORD.
  redis:
    container_name: redis
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    mem_limit: 256m
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - clevis

  # One-shot writer for the two secrets the operator would otherwise generate by hand. Each is created once, with
  # umask 077 and an atomic rename, on its own named volume and owned by the app uid (10001) the api/worker run
  # as. An existing file is never touched, and a JOB_SECRET_KEY / AUTH_SECRET set in .env still takes precedence
  # (the entrypoints only read the files when the variable is empty). The job secret is shared with the worker;
  # the auth secret is mounted into the api only, so the worker still never receives AUTH_SECRET.
  init-secrets:
    container_name: init-secrets
    image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    mem_limit: 32m
    restart: "no"
    volumes:
      - job-secret:/job
      - auth-secret:/auth
    command:
      - sh
      - -c
      - |
        set -eu
        umask 077
        gen() {
          [ -s "$$1" ] && return 0
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$$1.tmp"
          chown 10001:10001 "$$1.tmp"
          mv "$$1.tmp" "$$1"
          echo "init-secrets: generated $$2 (saved tokens encrypted under an earlier key will not decrypt)"
        }
        gen /job/job_secret JOB_SECRET_KEY
        gen /auth/auth_secret AUTH_SECRET
        chown 10001:10001 /job /auth
    networks:
      - clevis

  api:
    container_name: api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    mem_limit: 768m
    env_file:
      - .env
    expose:
      - "8080"
    volumes:
      - job-secret:/run/clevis/job:ro
      - auth-secret:/run/clevis/auth:ro
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - clevis

  worker:
    container_name: worker
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    mem_limit: 512m
    # An explicit list, not env_file: the worker parses GitHub-controlled webhook payloads and reads only
    # these values (see apps/worker/src/config.py and entrypoint.sh), so AUTH_SECRET, the GitHub App
    # secrets and the Postgres superuser password must not be in its environment.
    environment:
      DB_NAME: ${DB_NAME}
      JOB_SECRET_KEY: ${JOB_SECRET_KEY:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Optional: lets the worker ask the API for a fresh installation token per job attempt (shared with the API).
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:-}
      # Where it reaches the API for that refresh; change only if the api service name or port differs.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8080}
      GITHUB_API_BASE: ${GITHUB_API_BASE:-https://api.github.com}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:-}
      # Fallback credential for deployments without a dedicated worker role: entrypoint.sh only uses
      # DB_USER/DB_PASSWORD when WORKER_DB_PASSWORD is empty, so the superuser password is passed only then.
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${WORKER_DB_PASSWORD:-${DB_PASSWORD}}
    volumes:
      - job-secret:/run/clevis/job:ro
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # On stop/redeploy the worker finishes the job it is running before exiting (SIGTERM); Docker's default
    # 10 s would SIGKILL it first. Size this for the longest job you expect to run.
    stop_grace_period: 120s
    healthcheck:
      # worker.py's jobs-poll-loop thread and event_consumer.py's Redis-Streams-consumer thread
      # each touch a heartbeat file -- the job poller every loop iteration, the event consumer after every
      # cycle that actually reached Redis and Postgres (a consumer stuck in an error loop goes stale) --
      # catches a hung-but-alive thread that `restart: unless-stopped` alone wouldn't (that only fires on
      # a hard crash); both files must stay fresh.
      test: ["CMD", "python", "-c", "import time,sys,os; now=time.time(); sys.exit(0 if all(now - os.path.getmtime(f) < 60 for f in ('/tmp/worker_heartbeat', '/tmp/worker_event_consumer_heartbeat')) else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - clevis

  ui:
    container_name: ui
    build:
      context: apps/ui
      args:
        # NEXT_PUBLIC_* vars must be available at build time
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
        NEXT_PUBLIC_GITHUB_APP_SLUG: ${NEXT_PUBLIC_GITHUB_APP_SLUG:-}
        NEXT_PUBLIC_GITHUB_WEB_BASE: ${NEXT_PUBLIC_GITHUB_WEB_BASE:-https://github.com}
    mem_limit: 512m
    # Deliberately no `env_file: .env`: this container only serves the prebuilt bundle, and the
    # NEXT_PUBLIC_* values it needs are baked in at build time (build args above). Passing the
    # whole .env would hand it the DB credentials, JOB_SECRET_KEY, AUTH_SECRET, REDIS_PASSWORD
    # and the GitHub App private key, none of which it uses.
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
        required: false
    restart: unless-stopped
    healthcheck:
      # node, not curl -- the ui image's runner stage is node:22-alpine, which has no
      # curl/wget by default.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - clevis

networks:
  clevis:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  # Generated once by init-secrets. Back these up together with pgdata: without job-secret every saved token and
  # notification destination stops decrypting; without auth-secret everyone is signed out.
  job-secret:
  auth-secret:
