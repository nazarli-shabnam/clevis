name: clevis

# No host port bindings — Traefik (Coolify proxy) routes traffic to containers
# via the internal Docker network. Exposing ports to the host would conflict
# with Traefik on 8080 and is a security risk.
#
# Local dev: docker compose up db            → DB only (run api/ui/worker locally)
#            docker compose up --build       → full stack

services:
  # mem_limit values are tuned for a 4GB host, leaving headroom for the OS and Traefik --
  # without a per-container cap, one service creeping up in RSS starves the others via the
  # kernel OOM-killer, which doesn't necessarily pick the actual offender. Revisit if the
  # host's RAM budget changes.
  db:
    container_name: db
    image: postgres:17
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      # Consumed by docker/postgres-init/01-create-worker-role.sh on first init only --
      # unset means the worker keeps sharing DB_USER/DB_PASSWORD.
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:-}
      # Consumed by docker/postgres-init/02-create-api-role.sh on first init only --
      # unset means the API keeps connecting as the DB_USER superuser role.
      API_DB_PASSWORD: ${API_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - clevis

  # Managed queue for webhook ingestion (Redis Streams).
  # --appendonly yes: stream entries must survive a container restart -- a lost entry
  # here is a lost/delayed webhook event, not just a cache miss.
  # --requirepass: leaving Redis open would let any other compromised container on the
  # shared `clevis` network read, delete, or inject stream entries. REDIS_PASSWORD is
  # required, mirroring DB_PASSWORD.
  redis:
    container_name: redis
    image: redis:7-alpine
    mem_limit: 256m
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - clevis

  api:
    container_name: api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    mem_limit: 768m
    env_file:
      - .env
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - clevis

  worker:
    container_name: worker
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    mem_limit: 512m
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # worker.py's jobs-poll-loop thread and event_consumer.py's Redis-Streams-consumer thread
      # each touch a heartbeat file per loop iteration -- catches a hung-but-alive thread that
      # `restart: unless-stopped` alone wouldn't (that only fires on a hard crash); both files
      # must stay fresh.
      test: ["CMD", "python", "-c", "import time,sys,os; now=time.time(); sys.exit(0 if all(now - os.path.getmtime(f) < 60 for f in ('/tmp/worker_heartbeat', '/tmp/worker_event_consumer_heartbeat')) else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - clevis

  ui:
    container_name: ui
    build:
      context: apps/ui
      args:
        # NEXT_PUBLIC_* vars must be available at build time
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
        NEXT_PUBLIC_GITHUB_APP_SLUG: ${NEXT_PUBLIC_GITHUB_APP_SLUG:-}
        NEXT_PUBLIC_GITHUB_WEB_BASE: ${NEXT_PUBLIC_GITHUB_WEB_BASE:-https://github.com}
    mem_limit: 512m
    env_file:
      - .env
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
        required: false
    restart: unless-stopped
    healthcheck:
      # node, not curl -- the ui image's runner stage is node:22-alpine, which has no
      # curl/wget by default.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - clevis

networks:
  clevis:
    driver: bridge

volumes:
  pgdata:
  redisdata:
