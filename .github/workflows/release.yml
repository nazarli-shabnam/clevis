name: Release (Docker Images)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  publish:
    name: Build + Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gate: a manual dispatch may only publish from main, and only a commit whose CI run
      # passed -- so `:latest` can't be pushed from an arbitrary branch or an untested commit.
      - name: Gate on branch and CI
        # Context values go through env, never interpolated into the script (a ref name is
        # attacker-influenced text).
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual releases must be dispatched from main (got $GITHUB_REF)."
            exit 1
          fi
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion,status --jq '[.[] | select(.status == "completed")][0].conclusion // ""')
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI has not passed for $GITHUB_SHA (conclusion: '${conclusion:-none}')."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:latest
            ghcr.io/${{ github.repository }}-api:${{ github.ref_name }}

      - name: Build + Push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-worker:latest
            ghcr.io/${{ github.repository }}-worker:${{ github.ref_name }}

      - name: Build + Push UI
        uses: docker/build-push-action@v6
        with:
          context: apps/ui
          file: apps/ui/Dockerfile
          push: true
          # NEXT_PUBLIC_API_BASE is baked at build time — set via repo secret
          build-args: |
            NEXT_PUBLIC_API_BASE=${{ secrets.NEXT_PUBLIC_API_BASE }}
            NEXT_PUBLIC_GITHUB_APP_SLUG=${{ secrets.NEXT_PUBLIC_GITHUB_APP_SLUG }}
            NEXT_PUBLIC_GITHUB_WEB_BASE=${{ vars.NEXT_PUBLIC_GITHUB_WEB_BASE || 'https://github.com' }}
          tags: |
            ghcr.io/${{ github.repository }}-ui:latest
            ghcr.io/${{ github.repository }}-ui:${{ github.ref_name }}
